name: Build lyrics.json

# Recompile le fichier combiné data/lyrics.json à partir des fichiers
# par chanson data/lyrics/*.json (édités via le CMS).
# Le filtre `paths` ne matche PAS data/lyrics.json (sibling, hors du dossier)
# → le commit du combiné ne re-déclenche pas ce workflow (pas de boucle).

on:
  push:
    branches: [master]
    paths:
      - 'data/lyrics/**'
      - 'tools/build_lyrics.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Régénérer data/lyrics.json
        run: python tools/build_lyrics.py

      - name: Commit si les combinés ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lyrics.json data/quotes.json
          git diff --cached --quiet || (git commit -m "chore: rebuild lyrics.json + quotes.json [skip ci]" && git push)
