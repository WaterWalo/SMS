    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #060c06;
            --bg-card: #0d1f0d;
            --green-neon: #39ff14;
            --green-soft: #00c44f;
            --green-dim: #1a4a1a;
            --text-light: #d4f7d4;
            --text-muted: #7aab7a;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Raleway', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            animation: fade-in 0.8s ease both;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Metal Mania', cursive;
            font-size: clamp(3.5rem, 12vw, 7rem);
            letter-spacing: 12px;
            color: #fff;
            text-shadow:
                0 0 6px #fff,
                0 0 14px #fff,
                0 0 28px var(--green-neon),
                0 0 60px var(--green-neon),
                0 0 100px var(--green-soft);
            margin-bottom: 1.5rem;
            animation: neon-pulse 3s ease-in-out infinite alternate;
        }

        @keyframes neon-pulse {
            0% {
                text-shadow:
                    0 0 6px #fff,
                    0 0 14px #fff,
                    0 0 28px var(--green-neon),
                    0 0 60px var(--green-neon),
                    0 0 100px var(--green-soft);
            }

            100% {
                text-shadow:
                    0 0 4px #fff,
                    0 0 10px #fff,
                    0 0 20px var(--green-neon),
                    0 0 44px var(--green-neon),
                    0 0 80px var(--green-soft);
            }
        }

        .subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        .lang-prompt {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .lang-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .lang-button {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding: 2rem 3rem;
            font-family: 'Oswald', sans-serif;
            text-decoration: none;
            background: var(--bg-card);
            border: 2px solid var(--green-dim);
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            min-width: 200px;
        }

        .lang-button:hover {
            transform: translateY(-6px);
            border-color: var(--green-neon);
            box-shadow:
                0 10px 40px rgba(57, 255, 20, 0.25),
                inset 0 0 30px rgba(57, 255, 20, 0.08);
        }

        .lang-code {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--green-neon);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .lang-name {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .redirect-message {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--green-dim);
            letter-spacing: 1px;
            opacity: 0;
            animation: fade-in-delayed 0.6s ease 1s both;
        }

        @keyframes fade-in-delayed {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 500px) {
            .lang-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .lang-button {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="logo">SMS</h1>
        <p class="subtitle">Sad Mazda Songs</p>
        <p class="lang-prompt">Choose your language / Choisissez votre langue</p>

        <div class="lang-buttons">
            <a href="/fr/" class="lang-button" id="btn-fr">
                <span class="lang-code">FR</span>
                <span class="lang-name">Français</span>
            </a>
            <a href="/en/" class="lang-button" id="btn-en">
                <span class="lang-code">EN</span>
                <span class="lang-name">English</span>
            </a>
        </div>

        <p class="redirect-message">
            Auto-detecting language... / Détection automatique...
        </p>
    </div>

    <script>
        (function () {
            // Check localStorage for previous language preference
            const preferredLang = localStorage.getItem('sms-lang');

            if (preferredLang) {
                // Redirect to preferred language after short delay
                setTimeout(function () {
                    window.location.href = preferredLang === 'en' ? '/en/' : '/fr/';
                }, 800);
                return;
            }

            // Check browser language
            const browserLang = navigator.language || navigator.userLanguage;

            // Auto-redirect based on browser language after 2 seconds
            setTimeout(function () {
                if (browserLang && browserLang.toLowerCase().startsWith('fr')) {
                    window.location.href = '/fr/';
                } else {
                    window.location.href = '/en/';
                }
            }, 2500);

            // Store language choice when clicking buttons
            document.getElementById('btn-fr').addEventListener('click', function () {
                localStorage.setItem('sms-lang', 'fr');
            });

            document.getElementById('btn-en').addEventListener('click', function () {
                localStorage.setItem('sms-lang', 'en');
            });
        })();
    </script>
</body>
