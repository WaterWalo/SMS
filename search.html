<!DOCTYPE html>
<html lang="fr-CA">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KPRGFE7G0D"></script>
  <script src="assets/js/analytics.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Génie | SMS</title>

  <!-- SEO -->
  <meta name="description"
    content="Explorez les paroles de Sad Mazda Songs. Découvrez les références culturelles et punchlines cachées dans le rap underground québécois." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#87d4e0" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon.svg" />

  <!-- Hreflang -->
  <link rel="alternate" hreflang="fr-CA" href="https://sms.10-4.app/search.html?lang=fr" />
  <link rel="alternate" hreflang="en-CA" href="https://sms.10-4.app/search.html?lang=en" />
  <link rel="alternate" hreflang="x-default" href="https://sms.10-4.app/search.html?lang=fr" />

  <!-- Open Graph -->
  <meta property="og:title" content="Paroles SMS – Sad Mazda Songs" />
  <meta property="og:description"
    content="Explorez les paroles et références cachées dans le rap underground québécois." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sms.10-4.app/search.html" />
  <meta property="og:locale" content="fr_CA" />
  <meta property="og:image" content="https://sms.10-4.app/assets/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <link rel="canonical" href="https://sms.10-4.app/search.html?lang=fr" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/recherche.css" />
</head>

<body>

  <div class="page">

    <!-- ─── Sidebar ─── -->
    <aside class="sidebar" id="sidebar">

      <!-- Partie sticky : back link + brand + search -->
      <div class="sidebar__top">
        <a href="index.html" class="sidebar__back" aria-label="Retour au site principal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Site principal
        </a>
        <div class="sidebar__head">
          <h2 class="sidebar__brand"><em>Génie</em><span class="dot">.</span></h2>
          <p class="sidebar__brand-sub"><strong>SMS</strong></p>
        </div>

        <div class="search" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3" stroke-linecap="round"></path>
          </svg>
          <input id="search-input" type="search" placeholder="Chercher une parole…" autocomplete="off"
            aria-label="Rechercher dans les paroles" />
          <button id="search-clear" aria-label="Effacer la recherche" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Partie scrollable : liste des albums -->
      <div class="sidebar__scroll" id="sidebar-albums">
        <!-- Populated by JS -->
      </div>
    </aside>

    <!-- ─── Main ─── -->
    <main class="main" id="main">
      <div id="song-head-container">
        <!-- Populated by JS -->
      </div>
      <div class="lyrics" id="lyrics-container">
        <!-- Populated by JS -->
      </div>
    </main>

    <!-- ─── Annotation panel ─── -->
    <aside class="annot" id="annot-panel">
      <div id="annot-content">
        <!-- Populated by JS -->
      </div>
    </aside>

  </div>

  <!-- ─── Mobile nav ─── -->
  <nav class="mobile-nav" aria-label="Navigation mobile">
    <button class="mobile-nav__btn" id="mobile-menu-btn" aria-label="Ouvrir le catalogue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" />
      </svg>
    </button>
    <span class="mobile-nav__brand"><em>Génie</em><span class="dot">.</span></span>
    <button class="mobile-nav__btn" id="mobile-search-btn" aria-label="Rechercher">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" stroke-linecap="round" />
      </svg>
    </button>
  </nav>

  <!-- ─── Backdrop (drawer + bottom sheet) ─── -->
  <div class="mobile-backdrop" id="mobile-backdrop"></div>

  <!-- ─── Catalogue drawer ─── -->
  <div class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
    <div class="mobile-drawer__header">
      <a href="index.html" class="mobile-drawer__back">← SITE PRINCIPAL</a>
      <button class="mobile-drawer__close" id="mobile-drawer-close">FERMER</button>
    </div>
    <div class="mobile-drawer__title-block">
      <span class="mobile-drawer__brand"><em>Génie</em><span class="dot">.</span></span>
      <h2 class="mobile-drawer__catalogue-label">Catalogue</h2>
      <p class="mobile-drawer__sub">— SMS · <span id="mobile-projects-count">0</span> PROJETS</p>
    </div>
    <div class="mobile-drawer__search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" stroke-linecap="round" />
      </svg>
      <input type="search" class="mobile-drawer__search-input" id="mobile-search-input"
        placeholder="Chercher une parole…" autocomplete="off" aria-label="Rechercher dans les paroles">
    </div>
    <div class="mobile-drawer__content" id="mobile-drawer-content"></div>
  </div>

  <!-- ─── Bottom sheet annotation ─── -->
  <div class="mobile-sheet" id="mobile-sheet" aria-hidden="true">
    <div class="mobile-sheet__handle"></div>
    <div class="mobile-sheet__header">
      <div class="mobile-sheet__badge">
        <span class="mobile-sheet__num" id="sheet-num">1</span>
        <span class="mobile-sheet__label">ANNOTATION · LIGNE <span id="sheet-line">—</span></span>
      </div>
      <button class="mobile-sheet__close" id="mobile-sheet-close" aria-label="Fermer">✕</button>
    </div>
    <div class="mobile-sheet__body">
      <blockquote class="mobile-sheet__quote" id="sheet-quote"></blockquote>
      <h3 class="mobile-sheet__title" id="sheet-title"></h3>
      <div class="mobile-sheet__tags" id="sheet-tags"></div>
      <div class="mobile-sheet__text" id="sheet-body"></div>
    </div>
  </div>

  <!-- Fuse.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

  <!-- Paroles viewer -->
  <script src="assets/js/search.js"></script>

</body>

</html>
